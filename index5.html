<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learning Dashboard & Video System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2, h3 {
            color: #333;
            margin-top: 0;
        }
        
        /* สไตล์สำหรับหน้าแรก (Dashboard) */
        .welcome-banner {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 25px;
        }
        .welcome-banner p {
            margin: 5px 0 0 0;
            opacity: 0.9;
        }
        .lesson-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .lesson-card {
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            transition: all 0.2s ease;
        }
        .lesson-card.locked {
            background: #f8f9fa;
            opacity: 0.7;
        }
        .lesson-info h4 {
            margin: 0 0 5px 0;
            color: #2d3748;
        }
        .lesson-info p {
            margin: 0;
            font-size: 14px;
            color: #718096;
        }
        
        /* สไตล์สำหรับหน้าเล่นวิดีโอ */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 6px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        
        /* ปุ่มต่างๆ */
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-next {
            background-color: #28a745;
            color: white;
        }
        .btn-next:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        /* ข้อความสถานะ */
        .status {
            font-weight: bold;
            color: #d9534f;
            transition: color 0.3s;
        }
        .status.success {
            color: #28a745;
        }
        .status.warning {
            color: #ffc107;
        }
        
        /* การซ่อนหน้าจอ */
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ================= หน้าแรก: แนะนำบทเรียน ================= -->
    <div id="dashboard-view" class="view-section active">
        <div class="welcome-banner">
            <h2>ยินดีต้อนรับสู่คอร์ส Web Development เบื้องต้น</h2>
            <p>เรียนรู้วิธีการสร้างเว็บไซต์ตั้งแต่พื้นฐานจนถึงการเขียนโปรแกรมควบคุมด้วย JavaScript กรุณาเรียนตามลำดับบทเรียนเพื่อประสิทธิภาพสูงสุดครับ</p>
        </div>
        
        <h3>รายการบทเรียนทั้งหมด</h3>
        <div class="lesson-list" id="lesson-list-container">
            <!-- รายการบทเรียนจะถูกสร้างขึ้นอัตโนมัติจาก JavaScript ตรงนี้ -->
        </div>
    </div>

    <!-- ================= หน้าที่สอง: หน้าเล่นวิดีโอเรียน ================= -->
    <div id="video-view" class="view-section">
        <div style="margin-bottom: 15px;">
            <button class="btn btn-secondary" onclick="backToDashboard()">&larr; กลับหน้าหลัก</button>
        </div>
        
        <h2 id="video-title">บทเรียนที่ 1: กำลังโหลด...</h2>
        
        <!-- YouTube Player Container -->
        <div class="video-container">
            <div id="player"></div>
        </div>

        <div class="controls">
            <div id="status-text" class="status">สถานะ: กรุณาดูวิดีโอให้จบเพื่อปลดล็อคบทเรียนถัดไป</div>
            <button id="next-btn" class="btn btn-next" disabled onclick="nextVideo()">บทเรียนถัดไป &rarr;</button>
        </div>
    </div>

</div>

<script>
    // ข้อมูลวิดีโอและบทเรียน
    const playlist = [
        { id: 'Engku8MhzYo', title: 'บทเรียนที่ 1: พื้นฐานการพัฒนาเว็บ', desc: 'ทำความรู้จักกับโครงสร้าง HTML และการตกแต่งความสวยงามด้วย CSS เบื้องต้น' },
        { id: 'jNQXAC9IVRw', title: 'บทเรียนที่ 2: การเขียน JavaScript เบื้องต้น', desc: 'เรียนรู้การใช้ตัวแปร เงื่อนไข ลูป และการเขียนฟังก์ชันควบคุมหน้าเว็บ' },
        { id: 'tgbNymZ7vqY', title: 'บทเรียนที่ 3: สรุปเนื้อหาและแนวข้อสอบ', desc: 'ทบทวนหัวข้อสำคัญทั้งหมด พร้อมเทคนิคการทำข้อสอบเพื่อรับใบประกาศ' }
    ];

    // ตัวแปรเก็บประวัติการเรียน (ในงานจริงควรดึงและเซฟลง Database / LocalStorage)
    // 0 = กำลังเรียนบทแรก, 1 = เรียนบทที่ 1 จบแล้ว (ปลดล็อกบทที่ 2)
    let userProgressIndex = 0; 
    
    let currentVideoIndex = 0;
    let player;
    let lastTime = 0;
    let checkInterval = null;
    let isSeekingLocked = true;

    // โหลด YouTube IFrame Player API
    const tag = document.createElement('script');
    tag.src = "https://youtube.com";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        // เมื่อ API พร้อม ให้สร้างหน้าแสดงรายชื่อบทเรียนก่อน
        renderDashboard();
    }

    // ฟังก์ชันสร้าง UI รายชื่อบทเรียนที่หน้าแรก
    function renderDashboard() {
        const container = document.getElementById('lesson-list-container');
        container.innerHTML = ''; // เคลียร์ค่าเก่า

        playlist.forEach((lesson, index) => {
            const card = document.createElement('div');
            
            // ตรวจสอบว่าบทเรียนนี้ถูกล็อกอยู่หรือไม่
            const isLocked = index > userProgressIndex;
            const isCompleted = index < userProgressIndex;

            card.className = `lesson-card ${isLocked ? 'locked' : ''}`;
            
            let statusBadge = `<button class="btn btn-primary" onclick="startLesson(${index})">เข้าสู่บทเรียน</button>`;
            if (isLocked) {
                statusBadge = `<span style="color: #a0aec0;"><i style="margin-right:5px;">🔒</i>ยังไม่ปลดล็อก</span>`;
            } else if (isCompleted) {
                statusBadge = `
                    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:5px;">
                        <span style="color: #28a745; font-weight:bold;">✓ เรียนจบแล้ว</span>
                        <button class="btn btn-secondary" style="padding: 5px 10px; font-size:13px;" onclick="startLesson(${index})">ดูซ้ำ</button>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="lesson-info">
                    <h4>${lesson.title}</h4>
                    <p>${lesson.desc}</p>
                </div>
                <div>
                    ${statusBadge}
                </div>
            `;
            container.appendChild(card);
        });
    }

    // ฟังก์ชันกดเข้าเรียนจากหน้าแรก
    function startLesson(index) {
        currentVideoIndex = index;
        
        // สลับหน้าจอ ซ่อน Dashboard แสดงหน้าเล่นวิดีโอ
        document.getElementById('dashboard-view').classList.remove('active');
        document.getElementById('video-view').classList.add('active');
        
        loadVideo();
    }

    // ฟังก์ชันกดย้อนกลับไปหน้าแรก
    function backToDashboard() {
        // สั่งหยุดวิดีโอก่อนย้ายหน้า
        if (player && typeof player.pauseVideo === 'function') {
            player.pauseVideo();
        }
        
        // สลับหน้าจอ ซ่อนหน้าวิดีโอ แสดง Dashboard
        document.getElementById('video-view').classList.remove('active');
        document.getElementById('dashboard-view').classList.add('active');
        
        // วาดหน้าแรกใหม่เพื่ออัปเดตสถานะเผื่อเรียนจบแล้ว
        renderDashboard();
    }

    function loadVideo() {
        const currentVideo = playlist[currentVideoIndex];
        document.getElementById('video-title').innerText = currentVideo.title;
        
        // ลอจิกปลดล็อกปุ่มถัดไปล่วงหน้า หากผู้เรียนเคยเรียนจบวิดีโอนี้ไปแล้ว
        if (currentVideoIndex < userProgressIndex) {
            document.getElementById('next-btn').disabled = false;
            document.getElementById('status-text').innerText = "สถานะ: คุณเคยเรียนจบประเด็นนี้แล้ว สามารถข้ามหรือทบทวนได้ตามสะดวก";
            document.getElementById('status-text').className = "status success";
